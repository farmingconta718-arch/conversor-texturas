name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25b
      - name: astcenc
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone --depth 1 --branch 4.8.0 https://github.com/ARM-software/astc-encoder.git /tmp/astc
          cmake -B /tmp/astc/build -S /tmp/astc -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DASTCENC_CLI=ON -DASTCENC_ISA_NEON=ON
          cmake --build /tmp/astc/build -j"$(nproc)"
          BIN=$(find /tmp/astc/build -type f -name 'astcenc*' -perm -u+x | head -n1)
          mkdir -p app/libs/arm64-v8a
          cp "$BIN" app/libs/arm64-v8a/libastcenc.so
      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: APK
        working-directory: app
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: conversor-texturas-apk
          path: app/bin/*.apk
